name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: |
          pipx install poetry==2.4.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: poetry

      - name: Install dependencies
        run: make install-dev

      - name: Check formatting
        run: make format-check

  lint:
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: |
          pipx install poetry==2.4.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: poetry

      - name: Install dependencies
        run: make install-dev

      - name: Check package metadata
        run: poetry check --lock

      - name: Compile Python files
        run: poetry run python -m compileall master_config.py src interface evaluation tests

      - name: Run lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: |
          pipx install poetry==2.4.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: poetry

      - name: Install dependencies
        run: make install-dev

      - name: Run tests
        run: make tests
